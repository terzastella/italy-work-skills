name: gates

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate SKILL.md files
        run: python scripts/validate.py
      - name: Security check
        run: python scripts/security-check.py
      - name: Validate JSON indexes
        run: python -c "import json; json.load(open('catalog/skills.json', encoding='utf-8')); json.load(open('.claude-plugin/plugin.json', encoding='utf-8')); print('JSON OK')"
      - name: Index coherence (skills.json <-> plugin.json <-> docs)
        run: python scripts/check-indexes.py
      - name: Catalog check (no unclassified skills)
        run: python scripts/build-catalog.py --check
      - name: Golden eval (deterministic script fixtures)
        run: python scripts/eval-golden.py
      - name: Behavior guards (golden links/cases, delicate ban)
        run: python scripts/eval-behavior.py
      - name: Plugins sync (codex/cursor/gemini manifests)
        run: python scripts/build-plugins.py && git diff --exit-code .codex-plugin .cursor-plugin gemini-extension.json
      - name: Install dry-run (all skills, all agents)
        run: python scripts/install.py --all --dest ./tmp-test --dry-run
      - name: Upstream spec check (advisory, skills-ref is demo-only)
        continue-on-error: true
        run: |
          python -m pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"
          python scripts/check-spec.py

  vendors-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Vendor drift report (non-blocking, network)
        run: python scripts/sync-vendors.py --check
