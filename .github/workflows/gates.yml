name: gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate SKILL.md files
        run: python scripts/validate.py
      - name: Security check
        run: python scripts/security-check.py
      - name: Validate JSON indexes
        run: python -c "import json; json.load(open('catalog/skills.json', encoding='utf-8')); json.load(open('.claude-plugin/plugin.json', encoding='utf-8')); print('JSON OK')"
      - name: Index coherence (skills.json <-> plugin.json <-> docs)
        run: python scripts/check-indexes.py
      - name: Catalog check (no unclassified skills)
        run: python scripts/build-catalog.py --check
      - name: Golden eval (deterministic script fixtures)
        run: python scripts/eval-golden.py
      - name: Independent oracles (hand-computed calculator checks)
        run: python scripts/check-oracles.py
      - name: Structural invariants (calculator internal coherence)
        run: python scripts/check-invariants.py
      - name: Behavior guards (golden links/cases, delicate ban)
        run: python scripts/eval-behavior.py
      - name: Freshness gate (blocking, 254/254 stamped)
        run: python scripts/check-freshness.py --check
      - name: Semantic sources gate (blocking, pilot schema+dates)
        run: python scripts/check-sources.py --check
      - name: Source links liveness (advisory, network)
        continue-on-error: true
        run: python scripts/check-sources.py --check-links
      - name: Plugins sync (codex/cursor/gemini manifests)
        run: python scripts/build-plugins.py && git diff --exit-code .codex-plugin .cursor-plugin gemini-extension.json
      - name: Install dry-run (all skills, all agents)
        run: python scripts/install.py --all --dest ./tmp-test --dry-run
      - name: Installer rejects symlinked skills (attack simulation)
        run: |
          mkdir -p /tmp/evil-outside && echo stolen > /tmp/evil-outside/SKILL.md
          ln -s /tmp/evil-outside /tmp/evilskill
          python - <<'EOF'
          import sys; sys.path.insert(0, 'scripts')
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('ins', 'scripts/install.py')
          ins = importlib.util.module_from_spec(spec); spec.loader.exec_module(ins)
          evil = Path('/tmp/evilskill')
          assert evil.is_symlink(), "test setup failed"
          assert ins.has_symlink(evil), "dir-symlink not detected"
          assert ins.install_skill(evil, [Path('/tmp/evil-dest')], dry=True) is False
          import os
          os.makedirs('/tmp/innerskill', exist_ok=True)
          Path('/tmp/innerskill/SKILL.md').write_text('x')
          os.symlink('/tmp/evil-outside/SKILL.md', '/tmp/innerskill/leak.md')
          assert ins.has_symlink(Path('/tmp/innerskill')), "inner symlink not detected"
          assert ins.install_skill(Path('/tmp/innerskill'), [Path('/tmp/evil-dest')], dry=True) is False
          print("symlink attack blocked")
          EOF
      - name: Upstream spec check (advisory, skills-ref is demo-only)
        continue-on-error: true
        run: |
          python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          python scripts/check-spec.py

  vendors-drift:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Vendor drift report (non-blocking, network)
        run: python scripts/sync-vendors.py --check

